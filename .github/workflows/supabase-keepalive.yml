# =============================================================================
# Supabase Keep-Alive Workflow
# =============================================================================
# Purpose:
#   Prevents the Supabase free-tier project from being paused due to inactivity
#   by pinging the REST API every 6 hours, generating real database activity.
#
# GitHub Secrets Required (Settings → Secrets and Variables → Actions):
#
#   SUPABASE_URL      — Your project URL, e.g. https://xyzxyz.supabase.co
#                       Found at: Supabase Dashboard → Project Settings → API
#
#   SUPABASE_ANON_KEY — Your project's public anon key (safe to use; RLS
#                       protects your data). Do NOT use the service_role key.
#                       Found at: Supabase Dashboard → Project Settings → API
#
# Table Required:
#   Run the SQL in supabase/migrations/health_check.sql in your Supabase
#   SQL Editor (Dashboard → SQL Editor) to create the health_check table
#   with RLS enabled before this workflow runs.
# =============================================================================

name: Supabase Keep-Alive

on:
  # -- Runs automatically every 6 hours --------------------------------------
  schedule:
    - cron: "0 */6 * * *"   # At minute 0 past every 6th hour (UTC)

  # -- Also supports manual trigger from GitHub Actions tab ------------------
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    timeout-minutes: 5          # Fail fast; a ping should never take this long

    steps:
      # -- Step 1: Validate that secrets are configured ----------------------
      - name: Validate secrets are set
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "ERROR: SUPABASE_URL secret is not set."
            echo "Go to: GitHub repo -> Settings -> Secrets and Variables -> Actions -> New repository secret"
            exit 1
          fi

          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is not set."
            echo "Go to: GitHub repo -> Settings -> Secrets and Variables -> Actions -> New repository secret"
            exit 1
          fi

          echo "Secrets are configured."

      # -- Step 2: Debug - print masked URL being hit ------------------------
      - name: Debug connection info
        run: |
          # Print the URL (without exposing the key) to verify it's correct
          FULL_URL="${{ secrets.SUPABASE_URL }}/rest/v1/health_check?select=id&limit=1"
          echo "Target URL  : $FULL_URL"
          echo "Anon Key    : ${SUPABASE_ANON_KEY:0:20}..." 
          echo "Key length  : ${#SUPABASE_ANON_KEY} characters"
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # -- Step 3: Ping the Supabase REST API --------------------------------
      # Queries the health_check table (lightweight, RLS-gated public read).
      - name: Ping Supabase health_check table
        id: ping
        run: |
          echo "Pinging Supabase at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ..."

          # Run curl WITHOUT --fail so we always get the response body
          HTTP_STATUS=$(curl \
            --silent \
            --max-time 30 \
            --output /tmp/supabase_response.json \
            --write-out "%{http_code}" \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Accept: application/json" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/health_check?select=id&limit=1"
          )

          BODY=$(cat /tmp/supabase_response.json)

          echo "HTTP Status : $HTTP_STATUS"
          echo "Response    : $BODY"

          # Fail the workflow if we did not get a 2xx status
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo ""
            echo "Keep-alive ping FAILED (HTTP $HTTP_STATUS)."
            echo "  Response body above shows the exact Supabase error."
            exit 1
          fi

          echo ""
          echo "Keep-alive ping succeeded (HTTP $HTTP_STATUS). Supabase project is active."
